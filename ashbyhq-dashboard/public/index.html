<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApplyWizz — ASHBYHQ · Sign in</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="muted" style="letter-spacing:2px;font-weight:800;">APPLYWIZZ / ASHBYHQ</div>
      <h1>Staff portal</h1>
      <p class="muted">Enter your work email to open your dashboard &mdash; no verification code.
        Existing team members sign straight in; a new address is granted access only if it appears
        on the approved staff roster.</p>

      <!-- One email box. The server decides the role from the address: the fixed
           ADMIN/DEV emails, any already-rostered member (stored role), or a listing
           in the external staff/CA roster for a brand-new email. -->
      <div id="step-identity">
        <div class="auth-frame">
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" type="email" placeholder="you@applywizz.com" autocomplete="username" />
          </div>
          <div id="identity-msg"></div>
          <button class="primary" id="btn-send-code" style="width:100%;">Sign in &rarr;</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
